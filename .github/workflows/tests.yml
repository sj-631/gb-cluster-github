name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Real R/SALSO tests skip when optional R dependencies are unavailable.
      - run: python -m unittest discover -s tests -v
      - run: python examples/generate_toy_data.py --output-dir data/ci-toy --seed 123
      - run: >-
          python train.py --preset presets/smoke.json
          --x-path data/ci-toy/X.npy --y-path data/ci-toy/y.npy
          --output-dir outputs/ci-smoke --n-clusters 3 --device cpu
